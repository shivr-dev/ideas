<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Plan - Ore UI Edition</title>
    <style>
        /* ==========================================
           1. 字体声明 (修正为相对路径 ./)
        ========================================== */
        @font-face { 
            font-family: 'Minecraft Ten'; 
            src: url("./OreUI/fonts/Minecraft-Ten.otf") format('opentype'); 
        }
        @font-face { 
            font-family: 'Minecraft Seven'; 
            src: url("./OreUI/fonts/Minecraft-Seven-v4.ttf") format('truetype'); 
        }
        @font-face { 
            font-family: 'Minecraft Five Bold'; 
            src: url("./OreUI/fonts/Minecraft-Five-Bold.otf") format('opentype'); 
        }

        :root { color-scheme: light !important; }
        * { border-radius: 0 !important; box-sizing: border-box; } /* 严格去圆角 */

        body { 
            font-family: "Minecraft Seven", sans-serif; 
            background-color: #48494A; margin: 0; padding: 20px; color: #FFFFFF; 
        }

        /* ==========================================
           2. Ore UI 核心样式
        ========================================== */
        h1 { font-family: "Minecraft Ten", sans-serif; font-size: 32px; text-shadow: 2px 2px 0 #1E1E1F; margin: 0 0 20px 0; }
        h2, h3 { font-family: "Minecraft Five Bold", sans-serif; text-shadow: 2px 2px 0 #1E1E1F; margin-bottom: 10px; }

        .container { max-width: 1200px; margin: 0 auto; position: relative; }

        /* 状态栏 */
        .status-bar { 
            font-family: "Minecraft Five Bold", sans-serif; font-size: 14px; padding: 12px; margin-bottom: 20px; 
            border: 2px solid #1E1E1F; text-align: center; text-transform: uppercase;
        }
        .status-ok { background-color: #313233; color: #6CC349; box-shadow: inset 2px 2px rgba(255,255,255,0.1); }
        .status-error { background-color: #313233; color: #F46D6D; }

        /* 顶部工具栏 */
        .top-tools { position: absolute; top: 0; right: 0; display: flex; gap: 10px; }
        .tool-btn { 
            background-color: #313233; color: #FFFFFF; border: 2px solid #1E1E1F; 
            padding: 8px 12px; cursor: pointer; font-family: "Minecraft Five Bold", sans-serif;
            box-shadow: inset 2px 2px rgba(255, 255, 255, 0.1), inset -2px -2px rgba(0, 0, 0, 0.3);
        }

        /* 侧边栏/过滤器样式 (Minecraft Five Bold) */
        .filter-area { 
            background-color: #313233; border: 2px solid #1E1E1F; padding: 10px; margin-bottom: 15px;
            font-family: "Minecraft Five Bold", sans-serif; display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
        }
        .filter-label { cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; }

        /* 按钮系统 */
        .btn { 
            font-family: "Minecraft Seven", sans-serif; cursor: pointer; border: 2px solid #1E1E1F; 
            font-weight: bold; padding: 10px 20px 14px 20px; text-transform: uppercase; text-align: center;
        }
        .btn:active { transform: translateY(4px); padding-bottom: 10px; }
        
        .btn-add, .btn-close-modal, .btn-fullscreen { 
            background-color: #D0D1D4; color: #000; box-shadow: inset 0 -4px #58585A, inset 3px 3px rgba(255,255,255,0.5); 
        }
        .btn-save, .btn-vote { 
            background-color: #3C8527; color: #FFF; box-shadow: inset 0 -4px #1D4D13, inset 3px 3px rgba(255,255,255,0.2); 
        }
        .btn-delete-col, .btn-revoke { 
            background-color: #C33636; color: #FFF; box-shadow: inset 0 -4px #AD1D1D, inset 3px 3px rgba(255,255,255,0.2); 
        }

        /* 输入框与编辑器 */
        input[type="text"], input[type="password"], .editor-box, .guest-view-box { 
            background-color: #313233; color: #FFFFFF; border: 2px solid #1E1E1F;
            box-shadow: inset 0 4px #242425; padding: 10px; font-family: "Minecraft Seven", sans-serif; width: 100%; outline: none;
        }

        /* 表格系统 */
        .table-wrapper { overflow-x: auto; margin-bottom: 30px; border: 2px solid #1E1E1F; }
        table { border-collapse: collapse; width: max-content; background-color: #48494A; }
        th, td { border: 2px solid #1E1E1F; padding: 15px; width: 280px; vertical-align: top; }
        th { background-color: #313233; font-family: "Minecraft Five Bold", sans-serif; text-align: left; }

        /* 投票卡片 (Count 使用 Minecraft Ten) */
        .vote-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .vote-card { background-color: #313233; border: 2px solid #1E1E1F; padding: 20px; text-align: center; }
        .count { font-family: "Minecraft Ten", sans-serif; font-size: 48px; margin: 10px 0; text-shadow: 3px 3px 0 #1E1E1F; }

        /* 弹窗 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background-color: #313233; border: 4px solid #1E1E1F; width: 90%; max-width: 800px; padding: 30px; }
        
        .tag-badge { font-family: "Minecraft Five Bold", sans-serif; font-size: 11px; padding: 4px 8px; border: 2px solid #1E1E1F; color: #FFF; }
        .tag-想法 { background-color: #6CC349; }
        .tag-更新 { background-color: #FFE866; color: #000; }
        .tag-紧急 { background-color: #F46D6D; }
    </style>
</head>
<body>

<script>
    const oreSounds = {
        click: new Audio('./OreUI/sounds/sounds_click.ogg'),
        button: new Audio('./OreUI/sounds/sounds_button.ogg'),
        toast: new Audio('./OreUI/sounds/toast.ogg'),
        pop: new Audio('./OreUI/sounds/pop.ogg')
    };
    function playSnd(type) { try { if(oreSounds[type]) { oreSounds[type].currentTime = 0; oreSounds[type].play().catch(()=>{}); } } catch(e){} }
    document.addEventListener('click', (e) => {
        if (e.target.closest('.btn') || e.target.closest('.tool-btn')) playSnd('button');
        else if (e.target.closest('input')) playSnd('click');
    });
</script>

<div class="modal-overlay" id="loginModal" style="display: flex;">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <h2>AUTHORIZATION</h2>
        <input type="text" id="loginUser" style="margin-bottom:10px" placeholder="USERNAME">
        <input type="password" id="loginPass" style="margin-bottom:20px" placeholder="PASSWORD">
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn btn-save" onclick="adminLogin()">CONFIRM ADMIN</button>
            <button class="btn btn-close-modal" onclick="guestLogin()">GUEST ACCESS</button>
        </div>
    </div>
</div>

<div class="container" id="mainApp" style="display: none;">
    <div class="top-tools">
        <div class="tool-btn">ONLINE: <span id="onlineCount">1</span></div>
        <button class="tool-btn" onclick="logout()">LOGOUT</button>
    </div>

    <h1>MAP PLAN IDEAS</h1>
    <div id="status" class="status-bar status-ok">CONNECTED TO CLOUD</div>

    <div class="filter-area" id="filterArea">
        <span style="color:#B1B2B5">FILTER:</span>
        <label class="filter-label"><input type="checkbox" id="selectAllFilters" onchange="toggleAllFilters(this)" checked> ALL_VIEW</label>
        <div id="dynamicFilters" style="display: flex; gap: 12px;"></div>
    </div>
    
    <div class="table-wrapper">
        <table id="mainTable">
            <thead id="tHead"></thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>
    
    <div id="adminControls" style="display:none; margin-bottom: 40px;">
        <button class="btn btn-add" onclick="addColumn()">+ ADD NEW TOPIC</button>
        <button class="btn btn-save" onclick="manualSave()">SAVE TO GITHUB</button>
    </div>

    <hr style="border: 2px solid #313233; margin-bottom: 30px;">
    <h2>VOTING STATISTICS</h2>
    <div id="voteArea" class="vote-grid"></div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h2 id="modalTitle">CONTENT EDITOR</h2>
        <div id="adminEditorTools" style="margin-bottom:15px; display:none;">
            <span style="font-family:'Minecraft Five Bold'; color:#6CC349">ATTACH IMAGE: </span>
            <input type="file" id="imageInput" onchange="uploadImageToRepo(event)">
            <div style="margin-top:10px; display:flex; gap:5px;">
                <button class="tool-btn" onclick="document.execCommand('bold')">B</button>
                <button class="tool-btn" onclick="document.execCommand('italic')">I</button>
            </div>
        </div>
        <div id="fullscreenEditor" class="editor-box" contenteditable="true" style="min-height:300px; overflow-y:auto;"></div>
        <div id="fullscreenGuestView" class="guest-view-box" style="display:none; min-height:300px; overflow-y:auto;"></div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
            <button class="btn btn-close-modal" onclick="closeModal('editModal')">BACK</button>
            <button class="btn btn-save" id="btnSaveModal" onclick="saveFullscreen()">APPLY CHANGES</button>
        </div>
    </div>
</div>

<script>
    /* ==========================================
       3. 核心 JavaScript - 100% 功能保留
    ========================================== */
    const G_TOKEN = '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'; 
    const REPO_OWNER = 'shivr-dev';
    const REPO_NAME = 'ideas';
    const ISSUE_ID = 1; 

    let data = { topics: [], contents: [], editTimes: [], votes: [], groups: [], groupColors: [], tags: [] };
    let currentUserRole = null;
    let currentEditIndex = -1;
    let activeFilters = new Set();

    // 1. 初始化与登录
    window.onload = () => {
        const role = localStorage.getItem('userRole');
        if(role) grantAccess(role);
    };

    function adminLogin() {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPass').value;
        if(u === 'Infrato' && p === 'hajimi') {
            localStorage.setItem('userRole', 'admin');
            grantAccess('admin');
        } else { alert("WRONG CREDENTIALS"); }
    }
    function guestLogin() {
        localStorage.setItem('userRole', 'guest');
        grantAccess('guest');
    }
    function logout() { localStorage.removeItem('userRole'); location.reload(); }

    function grantAccess(role) {
        currentUserRole = role;
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        if(role === 'admin') document.getElementById('adminControls').style.display = 'block';
        loadData();
        setInterval(loadData, 10000); // 10秒自动同步
    }

    // 2. 数据云端同步
    async function loadData() {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${ISSUE_ID}`, {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const issue = await res.json();
            const remote = JSON.parse(issue.body);
            if(remote) {
                data = remote;
                if(activeFilters.size === 0) {
                    data.groups.forEach(g => activeFilters.add(g || "UNGROUPED"));
                }
                renderFilters(); renderTable(); renderVotes();
                showStatus("DATABASE SYNCED", "status-ok");
            }
        } catch (e) { showStatus("SYNC ERROR", "status-error"); }
    }

    async function saveDataToServer() {
        if(currentUserRole !== 'admin') return;
        showStatus("UPLOADING...", "status-ok");
        try {
            await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${ISSUE_ID}`, {
                method: 'PATCH', headers: { 'Authorization': `token ${G_TOKEN}` },
                body: JSON.stringify({ body: JSON.stringify(data) })
            });
            showStatus("CLOUD UPDATED", "status-ok");
        } catch (e) { showStatus("UPLOAD FAILED", "status-error"); }
    }

    // 3. 视图渲染 (Table & Votes)
    function renderTable() {
        const tHead = document.getElementById('tHead');
        const tBody = document.getElementById('tBody');
        tHead.innerHTML = ''; tBody.innerHTML = '';

        const tr1 = document.createElement('tr');
        const tr2 = document.createElement('tr');
        const tr3 = document.createElement('tr');

        const indices = data.topics.map((_, i) => i).filter(i => activeFilters.has(data.groups[i] || "UNGROUPED"));

        indices.forEach(i => {
            // ID 与 分组行
            let td1 = document.createElement('td');
            td1.style.borderTop = `6px solid ${data.groupColors[i] || '#313233'}`;
            td1.innerHTML = `<h2 style="color:${data.groupColors[i]}"># ${i+1}</h2>`;
            tr1.appendChild(td1);

            // 标题与标签行
            let td2 = document.createElement('td');
            if(currentUserRole === 'admin') {
                td2.innerHTML = `
                    <input type="text" id="topic_${i}" value="${data.topics[i]}">
                    <div style="margin-top:8px; display:flex; gap:5px;">
                        <input type="text" id="group_${i}" value="${data.groups[i]||''}" placeholder="GRP" style="flex:1">
                        <input type="color" id="color_${i}" value="${data.groupColors[i]||'#313233'}" style="width:30px; height:38px; border:2px solid #1E1E1F; background:none; padding:0">
                        <select id="tag_${i}" style="font-family:'Minecraft Seven'; background:#313233; color:#FFF; border:2px solid #1E1E1F;">
                            <option value="想法" ${data.tags[i]==='想法'?'selected':''}>IDEA</option>
                            <option value="更新" ${data.tags[i]==='更新'?'selected':''}>UPDT</option>
                            <option value="紧急" ${data.tags[i]==='紧急'?'selected':''}>URGT</option>
                        </select>
                    </div>`;
            } else {
                td2.innerHTML = `<span class="tag-badge tag-${data.tags[i]}">${data.tags[i]}</span><div class="guest-view-box" style="margin-top:5px">${data.topics[i]}</div>`;
            }
            tr2.appendChild(td2);

            // 内容与操作行
            let td3 = document.createElement('td');
            td3.innerHTML = `
                <div id="content_${i}" style="display:none">${data.contents[i]}</div>
                <div style="font-size:11px; color:#B1B2B5; margin-bottom:8px">REF: ${data.editTimes[i]||'NEW'}</div>
                <button class="btn btn-fullscreen" style="width:100%" onclick="openFullscreen(${i})">VIEW DETAILS</button>
                ${currentUserRole==='admin' ? `<button class="btn btn-delete-col" style="width:100%; margin-top:8px;" onclick="deleteColumn(${i})">REMOVE</button>` : ''}
            `;
            tr3.appendChild(td3);
        });

        tHead.appendChild(tr1); tBody.appendChild(tr2); tBody.appendChild(tr3);
    }

    function renderVotes() {
        const area = document.getElementById('voteArea');
        area.innerHTML = '';
        const indices = data.topics.map((_, i) => i).filter(i => activeFilters.has(data.groups[i] || "UNGROUPED"));
        
        indices.forEach(i => {
            const myVotes = JSON.parse(localStorage.getItem('myMapVotes') || '{}');
            const hasVoted = myVotes[i];
            area.innerHTML += `
                <div class="vote-card" style="border-top: 6px solid ${data.groupColors[i]}">
                    <span class="tag-badge tag-${data.tags[i]}">${data.tags[i]}</span>
                    <h3>${data.topics[i]}</h3>
                    <div class="count" style="color:${data.groupColors[i]}">${data.votes[i]}</div>
                    ${hasVoted ? `<button class="btn btn-revoke" onclick="revokeVote(${i})">REVOKE</button>` : `<button class="btn btn-vote" onclick="castVote(${i})">VOTE</button>`}
                </div>`;
        });
    }

    // 4. 过滤器逻辑 (Minecraft Five Bold)
    function renderFilters() {
        const container = document.getElementById('dynamicFilters');
        container.innerHTML = '';
        let groups = [...new Set(data.groups.map(g => g || "UNGROUPED"))];
        groups.forEach(g => {
            const isChecked = activeFilters.has(g) ? 'checked' : '';
            container.innerHTML += `<label class="filter-label"><input type="checkbox" value="${g}" onchange="toggleSingleFilter(this)" ${isChecked}> ${g}</label>`;
        });
    }
    function toggleAllFilters(cb) {
        activeFilters.clear();
        if(cb.checked) data.groups.forEach(g => activeFilters.add(g || "UNGROUPED"));
        renderTable(); renderVotes(); renderFilters();
    }
    function toggleSingleFilter(cb) {
        if(cb.checked) activeFilters.add(cb.value); else activeFilters.delete(cb.value);
        renderTable(); renderVotes();
    }

    // 5. 编辑器功能 (包含图片上传)
    function openFullscreen(i) {
        currentEditIndex = i;
        const isAdmin = (currentUserRole === 'admin');
        document.getElementById('adminEditorTools').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('btnSaveModal').style.display = isAdmin ? 'block' : 'none';
        
        if(isAdmin) {
            document.getElementById('fullscreenEditor').style.display = 'block';
            document.getElementById('fullscreenGuestView').style.display = 'none';
            document.getElementById('fullscreenEditor').innerHTML = data.contents[i];
        } else {
            document.getElementById('fullscreenEditor').style.display = 'none';
            document.getElementById('fullscreenGuestView').style.display = 'block';
            document.getElementById('fullscreenGuestView').innerHTML = data.contents[i];
        }
        openModal('editModal');
    }

    function saveFullscreen() {
        if(currentUserRole !== 'admin') return;
        data.contents[currentEditIndex] = document.getElementById('fullscreenEditor').innerHTML;
        closeModal('editModal');
        manualSave();
    }

    async function uploadImageToRepo(e) {
        const file = e.target.files[0]; if(!file) return;
        showStatus("PROCESSING IMAGE...", "status-ok");
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const base64 = ev.target.result.split(',')[1];
            const fileName = `img_${Date.now()}.png`;
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images/${fileName}`, {
                    method: 'PUT', headers: { 'Authorization': `token ${G_TOKEN}` },
                    body: JSON.stringify({ message: "upload img", content: base64 })
                });
                const resData = await res.json();
                document.execCommand('insertHTML', false, `<img src="${resData.content.download_url}" style="max-width:100%">`);
                showStatus("IMAGE READY", "status-ok");
            } catch(err) { alert("UPLOAD FAILED"); }
        };
        reader.readAsDataURL(file);
    }

    // 6. 增删改查逻辑
    function syncDomToData() {
        data.topics.forEach((_, i) => {
            const t = document.getElementById(`topic_${i}`);
            const g = document.getElementById(`group_${i}`);
            const c = document.getElementById(`color_${i}`);
            const tag = document.getElementById(`tag_${i}`);
            if(t) data.topics[i] = t.value;
            if(g) data.groups[i] = g.value;
            if(c) data.groupColors[i] = c.value;
            if(tag) data.tags[i] = tag.value;
        });
    }

    function addColumn() {
        data.topics.push("NEW_IDEA");
        data.contents.push("NO_DETAILS");
        data.votes.push(0);
        data.groups.push("UNGROUPED");
        data.groupColors.push("#D0D1D4");
        data.tags.push("想法");
        data.editTimes.push(new Date().toLocaleDateString());
        renderTable(); renderVotes(); renderFilters();
    }

    function deleteColumn(i) {
        if(!confirm("DELETE?")) return;
        data.topics.splice(i, 1); data.contents.splice(i, 1); data.votes.splice(i, 1);
        data.groups.splice(i, 1); data.groupColors.splice(i, 1); data.tags.splice(i, 1);
        renderTable(); renderVotes(); saveDataToServer();
    }

    function manualSave() { syncDomToData(); saveDataToServer(); }

    // 7. 投票系统
    function castVote(i) {
        const myVotes = JSON.parse(localStorage.getItem('myMapVotes') || '{}');
        data.votes[i]++; myVotes[i] = true;
        localStorage.setItem('myMapVotes', JSON.stringify(myVotes));
        renderVotes(); saveDataToServer();
    }
    function revokeVote(i) {
        const myVotes = JSON.parse(localStorage.getItem('myMapVotes') || '{}');
        if(data.votes[i] > 0) data.votes[i]--;
        delete myVotes[i];
        localStorage.setItem('myMapVotes', JSON.stringify(myVotes));
        renderVotes(); saveDataToServer();
    }

    // 8. 辅助 UI 函数
    function openModal(id) { document.getElementById(id).style.display = 'flex'; playSnd('pop'); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showStatus(msg, cls) { 
        const s = document.getElementById('status'); s.innerText = msg; s.className = `status-bar ${cls}`; 
        if(cls==='status-ok') playSnd('toast');
    }
</script>

</body>
</html>
