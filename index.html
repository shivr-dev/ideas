<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivr_dev 终极协作平台</title>
    <style>
        /* --- 1. 核心视觉系统 (回归经典并升级) --- */
        :root {
            --gh-blue: #0366d6;
            --gh-green: #2ea44f;
            --gh-red: #d73a49;
            --bg-gray: #f6f8fa;
            --border-color: #dfe2e5;
            --elastic: cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-gray); margin: 0; padding: 20px; color: #24292e; overflow-x: hidden; }
        
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .container { 
            max-width: 1300px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); position: relative;
            animation: popIn 0.6s var(--elastic);
        }

        /* --- 2. 状态与工具栏 --- */
        .top-nav { position: absolute; top: 40px; right: 40px; display: flex; gap: 12px; align-items: center; }
        .status-pill { 
            background: #fff; border: 1px solid var(--border-color); padding: 6px 15px; border-radius: 20px; 
            font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px;
            transition: all 0.3s var(--elastic); 
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gh-green); box-shadow: 0 0 6px var(--gh-green); }
        
        .status-msg { 
            font-size: 14px; padding: 12px; border-radius: 8px; margin-bottom: 25px; 
            text-align: center; font-weight: 600; border: 1px solid transparent; transition: 0.3s;
        }
        .ok { background: #dcffe4; color: #1a7f37; border-color: #bef5cb; }
        .err { background: #ffebe9; color: #cf222e; border-color: #ff8182; }

        /* --- 3. 表格系统 (分组聚合排序) --- */
        .scroll-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        table { border-collapse: separate; border-spacing: 0; width: max-content; }
        th, td { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 20px; width: 300px; vertical-align: top; background: #fff; }
        th { background: var(--bg-gray); color: #586069; font-size: 12px; text-transform: uppercase; text-align: center; }

        /* --- 4. 输入框与圆形拾色器 --- */
        .input-text, .rich-box { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; box-sizing: border-box; }
        .input-text:focus, .rich-box:focus { border-color: var(--gh-blue); box-shadow: 0 0 0 3px rgba(3,102,214,0.1); }
        
        .rich-box { min-height: 140px; text-align: left; overflow-y: auto; background: #fff; line-height: 1.6; }
        .rich-box img { max-width: 100%; border-radius: 6px; margin: 10px 0; display: block; }
        .view-only { background: #f9f9f9; cursor: default; }

        .group-sync-panel { display: flex; gap: 8px; margin-top: 10px; background: #f6f8fa; padding: 8px; border-radius: 8px; align-items: center; border: 1px solid #eee; }
        /* 正圆形拾色器修复 */
        .color-picker-circle { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; border: 3px solid #fff; border-radius: 50%; cursor: pointer; padding: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: transform 0.2s var(--elastic); }
        .color-picker-circle::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-circle::-webkit-color-swatch { border-radius: 50%; border: none; }
        .color-picker-circle:hover { transform: scale(1.2); }

        .group-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; color: white; font-size: 11px; font-weight: 800; margin-bottom: 8px; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* --- 5. 按钮体系 --- */
        .btn { border: 1px solid rgba(27,31,35,0.15); border-radius: 8px; font-weight: bold; cursor: pointer; padding: 8px 16px; transition: 0.2s var(--elastic); font-size: 14px; }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: var(--gh-green); color: white; }
        .btn-blue { background: #f1f8ff; color: var(--gh-blue); border-color: #c8e1ff; width: 100%; margin-top: 10px; }
        .btn-red { color: var(--gh-red); border: none; background: transparent; font-size: 12px; width: 100%; text-align: center; margin-top: 8px; }
        .btn-red:hover { text-decoration: underline; }

        /* --- 6. 投票卡片 --- */
        .vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 40px; }
        .vote-card { background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; text-align: center; transition: 0.3s; animation: fadeIn 0.8s ease; }
        .vote-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .vote-count { font-size: 48px; font-weight: 900; margin: 10px 0; color: var(--gh-red); transition: 0.3s; }

        /* --- 7. 弹窗系统 (全屏富文本) --- */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); animation: fadeIn 0.3s ease; }
        .modal { background: white; width: 90%; max-width: 900px; padding: 35px; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); animation: popIn 0.5s var(--elastic); }
        
        .toolbar { display: flex; gap: 8px; background: #f6f8fa; padding: 10px; border-radius: 8px 8px 0 0; border: 1px solid var(--border-color); border-bottom: none; }
        .t-btn { padding: 5px 12px; background: #fff; border: 1px solid var(--border-color); border-radius: 5px; cursor: pointer; font-weight: bold; }
        .t-btn:hover { background: #eee; }

        /* --- 8. 登录界面 --- */
        #loginOverlay { display: flex; z-index: 2000; }
        .login-box { max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div class="overlay" id="loginOverlay">
    <div class="modal login-box">
        <h2 style="margin-bottom: 25px;">🔑 开发者/游客验证</h2>
        <input type="text" id="user" class="input-text" style="margin-bottom: 12px;" placeholder="用户名 (管理员: Infrato)">
        <input type="password" id="pass" class="input-text" style="margin-bottom: 20px;" placeholder="密码">
        <div style="text-align: left; margin-bottom: 20px; font-size: 13px;">
            <label style="cursor: pointer;"><input type="checkbox" id="remember"> 记住登录状态 (3天内有效)</label>
        </div>
        <button class="btn btn-green" style="width: 100%; padding: 12px;" onclick="handleLogin('admin')">以管理员身份进入</button>
        <button class="btn" style="width: 100%; margin-top: 10px; padding: 12px; background: #eee; border: none;" onclick="handleLogin('guest')">以游客身份查看</button>
    </div>
</div>

<div class="container" id="appMain" style="display: none;">
    <div class="top-nav">
        <div class="status-pill"><div class="dot"></div><span id="onlineTag">在线人数: 3</span></div>
        <div class="status-pill" id="roleTag" style="color: var(--gh-blue);">角色加载中...</div>
        <button class="btn" style="padding: 6px 12px;" onclick="logout()">退出</button>
    </div>

    <h1>🗺️ Map Plan: 征集与计票系统</h1>
    <div id="status" class="status-msg ok">正在与 GitHub 云端同步...</div>

    <div class="scroll-wrapper">
        <table id="mainTable">
            <thead id="tHead"></thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>

    <div id="adminPanel" style="display: none; text-align: right; gap: 15px; margin-top: 20px;">
        <button class="btn" style="background: #f6f8fa;" onclick="addNewIdea()">+ 添加新创意列</button>
        <button class="btn btn-green" onclick="saveData()">💾 提交更改至 GitHub 仓库</button>
    </div>

    <hr style="margin: 50px 0; border: 0; border-top: 2px dashed #eee;">
    <h2 style="margin-bottom: 25px;">🗳️ 计票大厅 (同组颜色实时同步)</h2>
    <div id="voteArea" class="vote-grid"></div>
</div>

<div class="overlay" id="editorModal">
    <div class="modal">
        <h2 id="modalTitle">编辑详细说明</h2>
        <div id="adminUploadZone" style="background: #f1f8ff; border: 2px dashed var(--gh-blue); padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center;">
            <p style="margin: 0 0 10px 0; color: var(--gh-blue); font-weight: bold;">🖼️ 上传高清图至仓库 (/images)</p>
            <input type="file" id="imgInput" accept="image/*" onchange="uploadImageProcess(event)">
        </div>
        <div class="toolbar" id="textToolbar">
            <button class="t-btn" onclick="execCmd('bold')">B</button>
            <button class="t-btn" onclick="execCmd('italic')">I</button>
            <button class="t-btn" onclick="execCmd('underline')">U</button>
            <button class="t-btn" onclick="execCmd('insertUnorderedList')">• 列表</button>
            <span style="margin-left: auto; font-size: 12px; color: #999; align-self: center;">实时预览</span>
        </div>
        <div id="fullEditor" class="rich-box" style="min-height: 450px; border-radius: 0 0 10px 10px;" contenteditable="true"></div>
        <div style="margin-top: 25px; text-align: right; gap: 10px; display: flex; justify-content: flex-end;">
            <button class="btn" onclick="closeModal('editorModal')">关闭</button>
            <button class="btn btn-green" id="applyBtn" onclick="applyModalData()">应用修改</button>
        </div>
    </div>
</div>

<script>
    // --- 核心配置 ---
    const G_TOKEN = 'ghp_' + '这里填入你剩下的Token'; 
    const REPO = { owner: 'shivr-dev', name: 'Vote', issue: 1 };

    let db = { topics: [], contents: [], votes: [], groups: [], colors: [] };
    let role = 'guest';
    let activeIdx = -1;

    // --- 权限与持久化 (修复管理员空白Bug) ---
    window.onload = () => {
        const savedRole = localStorage.getItem('shivr_role');
        const expire = localStorage.getItem('shivr_expire');
        if (savedRole && expire && Date.now() < expire) {
            role = savedRole;
            initApp();
        }
    };

    function handleLogin(type) {
        if (type === 'admin') {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if (u === 'Infrato' && p === 'hajimi') role = 'admin';
            else { alert('验证失败！'); return; }
        }
        if (document.getElementById('remember').checked) {
            localStorage.setItem('shivr_role', role);
            localStorage.setItem('shivr_expire', Date.now() + 3 * 24 * 60 * 60 * 1000);
        }
        initApp();
    }

    function initApp() {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appMain').style.display = 'block';
        document.getElementById('roleTag').innerText = role === 'admin' ? '👑 管理员' : '👤 游客模式';
        if (role === 'admin') document.getElementById('adminPanel').style.display = 'flex';
        
        loadData();
        setInterval(loadData, 10000); // 10秒背景静默刷新
        updateOnlineCount();
    }

    function logout() { localStorage.clear(); location.reload(); }

    // --- 数据交互 ---
    async function loadData() {
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/issues/${REPO.issue}`, {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const json = await res.json();
            const remote = JSON.parse(json.body);
            // 完整合并数据
            db = {
                topics: remote.topics || [],
                contents: remote.contents || [],
                votes: remote.votes || [],
                groups: remote.groups || remote.topics.map(()=>""),
                colors: remote.colors || remote.topics.map(()=>"#0366d6")
            };
            render();
            setStatus("✅ 云端同步成功", "ok");
        } catch(e) { setStatus("❌ 无法同步云端", "err"); }
    }

    async function saveData() {
        if (role !== 'admin') return;
        syncDOMtoDB();
        setStatus("⏳ 正在发布...", "ok");
        try {
            await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/issues/${REPO.issue}`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${G_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ body: JSON.stringify(db) })
            });
            setStatus("✅ 更改已全服发布", "ok");
            render();
        } catch(e) { setStatus("❌ 保存失败", "err"); }
    }

    // --- 渲染逻辑 (分组颜色同步) ---
    function render() {
        const h = document.getElementById('tHead'), b = document.getElementById('tBody');
        h.innerHTML = ''; b.innerHTML = '';
        const rows = [document.createElement('tr'), document.createElement('tr'), document.createElement('tr')];

        // 排序逻辑：有组名的排一起
        let map = db.topics.map((_, i) => i).sort((a,b) => (db.groups[a]||"zz").localeCompare(db.groups[b]||"zz"));

        map.forEach(idx => {
            const color = db.colors[idx] || "#0366d6";
            const group = db.groups[idx] || "";

            // Row 0: 编号
            let td0 = document.createElement('td');
            td0.style.borderTop = group ? `8px solid ${color}` : '1px solid var(--border-color)';
            td0.innerHTML = `<strong style="color:${color}">IDEA #${idx+1}</strong>`;
            rows[0].appendChild(td0);

            // Row 1: 标题与分组 (核心同步)
            let td1 = document.createElement('td');
            if (role === 'admin') {
                td1.innerHTML = `
                    <input type="text" id="t_${idx}" class="input-text" value="${db.topics[idx]}" placeholder="创意名称">
                    <div class="group-sync-panel">
                        <input type="text" id="g_${idx}" class="input-text" style="padding:5px; font-size:12px;" value="${group}" placeholder="分组" oninput="liveColorSync(${idx})">
                        <input type="color" id="c_${idx}" class="color-picker-circle" value="${color}" oninput="liveColorSync(${idx})">
                    </div>`;
            } else {
                td1.innerHTML = group ? `<div class="group-badge" style="background:${color}">${group}</div>` : '';
                td1.innerHTML += `<div class="rich-box view-only" style="min-height:auto; font-weight:bold;">${db.topics[idx] || '未命名的创意'}</div>`;
            }
            rows[1].appendChild(td1);

            // Row 2: 内容预览
            let td2 = document.createElement('td');
            td2.innerHTML = `
                <div id="cnt_${idx}" class="rich-box ${role==='guest'?'view-only':''}" contenteditable="${role==='admin'}">${db.contents[idx] || ''}</div>
                <button class="btn btn-blue" onclick="openFullEditor(${idx})">🔍 ${role==='admin'?'全屏/图片/排版':'查看详情/图片'}</button>
                ${role==='admin' ? `<button class="btn btn-red" onclick="removeIdea(${idx})">🗑️ 移除此列</button>` : ''}`;
            rows[2].appendChild(td2);
        });

        rows.forEach(r => b.appendChild(r));
        renderVotes(map);
    }

    // 实时同步：同组名秒变色
    function liveColorSync(triggerIdx) {
        const groupVal = document.getElementById(`g_${triggerIdx}`).value.trim();
        const colorVal = document.getElementById(`c_${triggerIdx}`).value;
        if (!groupVal) return;

        db.topics.forEach((_, i) => {
            const gInp = document.getElementById(`g_${i}`);
            const cInp = document.getElementById(`c_${i}`);
            if (gInp && gInp.value.trim() === groupVal) {
                cInp.value = colorVal;
                document.getElementById('mainTable').rows[0].cells[i].style.borderTopColor = colorVal;
            }
        });
        syncDOMtoDB();
        renderVotes(db.topics.map((_, i) => i).sort((a,b) => (db.groups[a]||"zz").localeCompare(db.groups[b]||"zz")));
    }

    function renderVotes(map) {
        const area = document.getElementById('voteArea');
        area.innerHTML = '';
        const myVotes = JSON.parse(localStorage.getItem('my_votes') || '{}');
        map.forEach(idx => {
            const c = db.colors[idx] || "#0366d6";
            area.innerHTML += `
                <div class="vote-card" style="border-top: 6px solid ${c}">
                    ${db.groups[idx] ? `<div class="group-badge" style="background:${c}">${db.groups[idx]}</div>` : ''}
                    <h3 style="margin:0;">${db.topics[idx] || '新地图创意'}</h3>
                    <div class="vote-count" style="color:${c}">${db.votes[idx]}</div>
                    <button class="btn" style="width:100%; padding:10px; background:${myVotes[idx]?'#fff':c}; color:${myVotes[idx]?var(--gh-red):'#fff'}; border:${myVotes[idx]?'1px solid '+var(--gh-red):'none'}" onclick="handleVote(${idx})">
                        ${myVotes[idx] ? '↩ 撤回支持' : '👆 支持想法'}
                    </button>
                </div>`;
        });
    }

    // --- 图片压缩与 GitHub 上传算法 (完整保留) ---
    async function uploadImageProcess(e) {
        const file = e.target.files[0];
        if (!file) return;
        setStatus("⌛ 正在云端压缩并上传...", "ok");
        const reader = new FileReader();
        reader.onload = (re) => {
            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const MAX = 1400; // 宽限制
                let w = img.width, h = img.height;
                if (w > MAX) { h *= MAX/w; w = MAX; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                const fname = `mapimg_${Date.now()}.jpg`;
                
                try {
                    const res = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/images/${fname}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${G_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: "img upload", content: base64 })
                    });
                    const dataRes = await res.json();
                    document.getElementById('fullEditor').focus();
                    document.execCommand('insertHTML', false, `<img src="${dataRes.content.download_url}">`);
                    setStatus("✅ 图片上传成功！", "ok");
                } catch(err) { alert("上传失败，检查 Token 权限"); }
            };
            img.src = re.target.result;
        };
        reader.readAsDataURL(file);
    }

    // --- 辅助功能 ---
    function syncDOMtoDB() {
        db.topics.forEach((_, i) => {
            const t = document.getElementById(`t_${i}`), c = document.getElementById(`cnt_${i}`);
            const g = document.getElementById(`g_${i}`), cl = document.getElementById(`c_${i}`);
            if (t) db.topics[i] = t.value;
            if (c) db.contents[i] = c.innerHTML;
            if (g) db.groups[i] = g.value.trim();
            if (cl) db.colors[i] = cl.value;
        });
    }

    function handleVote(i) {
        let votes = JSON.parse(localStorage.getItem('my_votes') || '{}');
        if (votes[i]) { db.votes[i]--; delete votes[i]; }
        else { db.votes[i]++; votes[i] = true; }
        localStorage.setItem('my_votes', JSON.stringify(votes));
        render(); saveData(); // 投票触发即时保存
    }

    function addNewIdea() {
        syncDOMtoDB();
        db.topics.push(""); db.contents.push(""); db.votes.push(0);
        db.groups.push(""); db.colors.push("#0366d6");
        render();
    }

    function removeIdea(i) {
        if (!confirm('确定彻底移除吗？')) return;
        syncDOMtoDB();
        db.topics.splice(i, 1); db.contents.splice(i, 1);
        db.votes.splice(i, 1); db.groups.splice(i, 1); db.colors.splice(i, 1);
        render();
    }

    function openFullEditor(idx) {
        activeIdx = idx;
        const isAdmin = (role === 'admin');
        document.getElementById('modalTitle').innerText = isAdmin ? '✏️ 编辑详细创意' : '🔍 创意详情预览';
        document.getElementById('adminUploadZone').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('textToolbar').style.display = isAdmin ? 'flex' : 'none';
        document.getElementById('applyBtn').style.display = isAdmin ? 'inline-block' : 'none';
        document.getElementById('fullEditor').contentEditable = isAdmin;
        document.getElementById('fullEditor').innerHTML = db.contents[idx];
        document.getElementById('editorModal').style.display = 'flex';
    }

    function applyModalData() {
        document.getElementById(`cnt_${activeIdx}`).innerHTML = document.getElementById('fullEditor').innerHTML;
        closeModal('editorModal');
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function setStatus(msg, cls) { const s = document.getElementById('status'); s.innerText = msg; s.className = `status-msg ${cls}`; }
    function execCmd(c) { document.execCommand(c, false, null); }
    function updateOnlineCount() { document.getElementById('onlineTag').innerText = `在线人数: ${Math.floor(Math.random()*5)+2}`; }
</script>
</body>
</html>
