<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivr_dev 终极创意面板 v4.0</title>
    <style>
        /* --- 1. 核心弹性动画 (贝塞尔曲线) --- */
        :root {
            --elastic: cubic-bezier(0.68, -0.55, 0.27, 1.55);
            --smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --primary: #0366d6;
        }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(45, 164, 78, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(45, 164, 78, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(45, 164, 78, 0); } }

        /* --- 2. 基础样式 --- */
        body { font-family: -apple-system, system-ui, sans-serif; background: #f4f7f9; margin: 0; padding: 20px; color: #1a1a1a; }
        .container { 
            max-width: 1300px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); position: relative;
            animation: popIn 0.6s var(--elastic);
        }

        /* --- 3. 顶部工具栏 --- */
        .header-tools { position: absolute; top: 30px; right: 40px; display: flex; gap: 12px; align-items: center; }
        .badge-btn { 
            background: #f0f2f5; border: none; padding: 8px 16px; border-radius: 30px; 
            font-weight: bold; color: #555; display: flex; align-items: center; gap: 8px;
            transition: all 0.3s var(--elastic); cursor: default;
        }
        .logout-btn { cursor: pointer; background: #ffeef0; color: #d73a49; }
        .logout-btn:hover { background: #d73a49; color: white; transform: translateY(-2px); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #2da44e; animation: pulse 2s infinite; }

        /* --- 4. 状态指示器 --- */
        .status-msg { 
            font-size: 14px; padding: 12px; border-radius: 10px; margin-bottom: 25px; 
            text-align: center; font-weight: 600; transition: all 0.3s ease;
        }
        .ok { background: #e6ffed; color: #22863a; border: 1px solid #acf2bd; }
        .err { background: #ffeef0; color: #d73a49; border: 1px solid #fdb8c0; }

        /* --- 5. 表格与分组系统 --- */
        .scroll-x { overflow-x: auto; border-radius: 12px; border: 1px solid #e1e4e8; margin-bottom: 30px; }
        .scroll-x::-webkit-scrollbar { height: 8px; }
        .scroll-x::-webkit-scrollbar-thumb { background: #d1d5da; border-radius: 10px; }
        
        table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; }
        th, td { 
            padding: 20px; border-right: 1px solid #e1e4e8; border-bottom: 1px solid #e1e4e8; 
            width: 300px; background: #fff; vertical-align: top;
            transition: all 0.3s ease;
        }
        th { background: #fafbfc; color: #586069; font-size: 12px; text-align: center; }

        .group-tag-box { 
            display: flex; align-items: center; gap: 8px; margin-top: 10px; 
            background: #f6f8fa; padding: 8px; border-radius: 8px;
        }
        
        /* 修复：正圆形调色盘 */
        .circle-picker {
            -webkit-appearance: none; border: 2px solid #fff; width: 30px; height: 30px; 
            border-radius: 50%; cursor: pointer; padding: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s var(--elastic);
        }
        .circle-picker::-webkit-color-swatch-wrapper { padding: 0; }
        .circle-picker::-webkit-color-swatch { border-radius: 50%; border: none; }
        .circle-picker:hover { transform: scale(1.2) rotate(15deg); }

        .group-badge { 
            display: inline-block; padding: 3px 10px; border-radius: 20px; 
            color: white; font-size: 11px; font-weight: 800; margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* --- 6. 输入框与内容 --- */
        .title-input { font-weight: bold; border-color: #d1d5da; }
        .rich-box { 
            min-height: 140px; border: 1px solid #d1d5da; border-radius: 8px; padding: 12px;
            text-align: left; font-size: 14px; line-height: 1.6; overflow-y: auto; outline: none;
        }
        .rich-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(3,102,214,0.1); }
        .rich-box img { max-width: 100%; border-radius: 6px; margin: 10px 0; }

        /* --- 7. 投票卡片 (实时变色) --- */
        .vote-section { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .vote-card { 
            background: #fff; border: 1px solid #e1e4e8; border-radius: 16px; padding: 25px; 
            text-align: center; transition: all 0.4s var(--elastic);
        }
        .vote-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .vote-num { font-size: 48px; font-weight: 900; margin: 15px 0; transition: color 0.3s ease; }

        /* --- 8. 按钮体系 --- */
        .btn { 
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
            transition: all 0.3s var(--elastic); font-size: 14px;
        }
        .btn:active { transform: scale(0.95); }
        .primary-btn { background: var(--primary); color: white; padding: 12px 25px; }
        .add-btn { background: #2ea44f; color: white; padding: 12px 25px; }
        .full-btn { background: #f1f8ff; color: var(--primary); border: 1px solid #c8e1ff; width: 100%; margin-top: 10px; padding: 8px; }
        .del-btn { background: #fff; color: #d73a49; border: 1px solid #fdb8c0; width: 100%; margin-top: 8px; padding: 6px; font-size: 12px; }

        /* --- 9. 弹窗与编辑器 --- */
        .overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; 
            backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s ease;
        }
        .modal { 
            background: white; width: 90%; max-width: 900px; padding: 35px; border-radius: 24px; 
            max-height: 90vh; overflow-y: auto; animation: popIn 0.5s var(--elastic) forwards;
        }
        .toolbar { display: flex; gap: 8px; background: #f6f8fa; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e1e4e8; }
        .tool { background: white; border: 1px solid #d1d5da; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .tool:hover { background: #f0f2f5; }

        /* 响应式 */
        @media (max-width: 768px) { .container { padding: 20px; } .header-tools { position: relative; top: 0; right: 0; margin-bottom: 20px; } }
    </style>
</head>
<body>

<div class="overlay" id="loginModal" style="display: flex; opacity: 1;">
    <div class="modal" style="max-width: 450px; text-align: center;">
        <h2 id="modalHead">🚀 欢迎进入开发面板</h2>
        <div id="loginForm">
            <input type="text" id="user" class="rich-box" style="min-height: auto; margin-bottom: 15px;" placeholder="用户名 (管理员请输入 Infrato)">
            <input type="password" id="pass" class="rich-box" style="min-height: auto; margin-bottom: 20px;" placeholder="密码">
            <div style="text-align: left; margin-bottom: 20px; font-size: 13px;">
                <label style="cursor: pointer;"><input type="checkbox" id="saveLogin"> 记住此次登录 (3天内免登)</label>
            </div>
            <button class="btn primary-btn" style="width: 100%;" onclick="attemptLogin('admin')">管理员登录</button>
            <button class="btn" style="width: 100%; margin-top: 10px; background: #eee;" onclick="attemptLogin('guest')">游客进入 (仅查看与投票)</button>
        </div>
        <div id="guideForm" style="display: none; text-align: left;">
            <p>👋 <strong>管理员你好！</strong></p>
            <ul style="font-size: 14px; color: #444; line-height: 1.8;">
                <li><strong>分组功能</strong>：填写相同分组名，颜色会自动同步。</li>
                <li><strong>全屏编辑</strong>：点击详情可上传高清图片至 GitHub。</li>
                <li><strong>贝塞尔曲线</strong>：所有交互都经过弹性优化。</li>
            </ul>
            <button class="btn primary-btn" style="width: 100%;" onclick="closeModal('loginModal')">知道了，开始工作</button>
        </div>
    </div>
</div>

<div class="container" id="app" style="display: none;">
    <div class="header-tools">
        <div class="badge-btn">
            <div class="dot"></div>
            <span id="onlineTag">在线: --</span>
        </div>
        <div class="badge-btn logout-btn" onclick="performLogout()">登出账号</div>
    </div>

    <h1>🗺️ Map Plan: 主意征集系统</h1>
    <div id="status" class="status-msg ok">正在连接到 GitHub 数据库...</div>

    <div class="scroll-x">
        <table id="mainTable">
            <thead id="tHead"></thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>

    <div id="adminActions" style="display: none; display: flex; justify-content: flex-end; gap: 15px;">
        <button class="btn add-btn" onclick="addNewIdea()">+ 新增一个地图创意</button>
        <button class="btn primary-btn" onclick="pushToCloud()">💾 提交所有修改并发布</button>
    </div>

    <hr style="margin: 50px 0; border: 0; border-top: 2px dashed #e1e4e8;">
    <h2>🗳️ 创意计票区 (实时更新颜色)</h2>
    <div id="voteArea" class="vote-section"></div>
</div>

<div class="overlay" id="editorModal">
    <div class="modal">
        <h2 id="editTitle">创意详细说明</h2>
        <div id="adminEditorTools">
            <div style="background: #f1f8ff; border: 2px dashed #0366d6; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center;">
                <p style="margin: 0 0 10px 0; color: #0366d6; font-weight: bold;">📁 上传高清图片 (会自动存入仓库 /images 文件夹)</p>
                <input type="file" id="imgUpload" accept="image/*" onchange="processImage(event)">
            </div>
            <div class="toolbar">
                <button class="tool" onclick="formatDoc('bold')">B</button>
                <button class="tool" onclick="formatDoc('italic')">I</button>
                <button class="tool" onclick="formatDoc('underline')">U</button>
                <button class="tool" onclick="formatDoc('insertUnorderedList')">• 列表</button>
                <span style="margin-left: auto; font-size: 12px; color: #888; align-self: center;">编辑结果实时应用</span>
            </div>
        </div>
        <div id="modalEditor" class="rich-box" style="min-height: 450px;" contenteditable="true"></div>
        <div style="margin-top: 25px; text-align: right; display: flex; justify-content: flex-end; gap: 12px;">
            <button class="btn" style="background: #eee; padding: 10px 30px;" onclick="closeModal('editorModal')">关闭</button>
            <button class="btn primary-btn" id="modalConfirm" onclick="syncModalBack()">应用更改</button>
        </div>
    </div>
</div>

<script>
    /* --- 1. 配置信息 --- */
    const G_TOKEN = 'ghp_' + '在此输入剩下的Token';
    const REPO = { owner: 'shivr-dev', name: 'Vote', issue: 1 };

    let db = { topics: [], contents: [], editTimes: [], votes: [], groups: [], colors: [] };
    let role = 'guest';
    let curIdx = -1;

    /* --- 2. 登录与持久化 --- */
    window.onload = () => {
        const saved = localStorage.getItem('shivr_role');
        const expire = localStorage.getItem('shivr_expire');
        if (saved && expire && Date.now() < expire) {
            role = saved;
            launchApp();
        }
    };

    function attemptLogin(type) {
        if (type === 'admin') {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if (u === 'Infrato' && p === 'hajimi') role = 'admin';
            else { alert('验证失败'); return; }
        }
        if (document.getElementById('saveLogin').checked) {
            localStorage.setItem('shivr_role', role);
            localStorage.setItem('shivr_expire', Date.now() + 3 * 24 * 60 * 60 * 1000);
        }
        
        if (role === 'admin') {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('guideForm').style.display = 'block';
            document.getElementById('modalHead').innerText = '🎉 身份验证通过';
        } else {
            launchApp();
        }
    }

    function performLogout() { localStorage.clear(); location.reload(); }

    /* --- 3. 数据交互 --- */
    async function launchApp() {
        closeModal('loginModal');
        document.getElementById('app').style.display = 'block';
        if (role === 'admin') document.getElementById('adminActions').style.display = 'flex';
        await fetchCloud();
        setInterval(fetchCloud, 10000); // 10秒背景静默刷新
        updateOnline();
    }

    async function fetchCloud() {
        try {
            const r = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/issues/${REPO.issue}`, {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const j = await r.json();
            const cloudData = JSON.parse(j.body);
            // 数据补全，防止旧版本数据缺失字段
            db = {
                topics: cloudData.topics || [],
                contents: cloudData.contents || [],
                editTimes: cloudData.editTimes || [],
                votes: cloudData.votes || [],
                groups: cloudData.groups || cloudData.topics.map(()=>""),
                colors: cloudData.colors || cloudData.topics.map(()=>"#0366d6")
            };
            renderAll();
            setUIStatus("✅ 数据已同步到最新版本", "ok");
        } catch(e) { setUIStatus("❌ 云端同步异常", "err"); }
    }

    async function pushToCloud() {
        if (role !== 'admin') return;
        setUIStatus("⏳ 正在全力上传数据...", "ok");
        scrapeDOM(); // 提取DOM中的即时修改
        try {
            await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO_NAME}/issues/${REPO_ISSUE}`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${G_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ body: JSON.stringify(db) })
            });
            setUIStatus("✅ 所有更改已全球发布", "ok");
            renderAll();
        } catch(e) { setUIStatus("❌ 发布失败，请检查配置", "err"); }
    }

    /* --- 4. 核心渲染 (带排序映射) --- */
    function renderAll() {
        const h = document.getElementById('tHead');
        const b = document.getElementById('tBody');
        h.innerHTML = ''; b.innerHTML = '';
        const rows = [document.createElement('tr'), document.createElement('tr'), document.createElement('tr')];

        // 排序逻辑：按分组字母序，同组按原编号
        let map = db.topics.map((_, i) => i).sort((a, b) => {
            const gA = db.groups[a] || "zzzz"; // 无分组的排最后
            const gB = db.groups[b] || "zzzz";
            return gA.localeCompare(gB) || a - b;
        });

        map.forEach(idx => {
            const group = db.groups[idx] || "";
            const color = db.colors[idx] || "#0366d6";

            // Row 0: 顶部色条与编号
            let td0 = document.createElement('td');
            td0.style.borderTop = group ? `8px solid ${color}` : '1px solid #e1e4e8';
            td0.innerHTML = `<span style="color:${color}; font-weight:900;"># ${idx+1}</span>`;
            rows[0].appendChild(td0);

            // Row 1: 标题与分组 (同步变色核心)
            let td1 = document.createElement('td');
            if (role === 'admin') {
                td1.innerHTML = `
                    <input type="text" id="t_${idx}" class="rich-box title-input" style="min-height:auto;" value="${db.topics[idx]}">
                    <div class="group-tag-box">
                        <input type="text" id="g_${idx}" class="rich-box" style="min-height:auto; font-size:12px;" value="${group}" placeholder="分组名" oninput="liveColorSync(${idx})">
                        <input type="color" id="c_${idx}" class="circle-picker" value="${color}" oninput="liveColorSync(${idx})">
                    </div>`;
            } else {
                td1.innerHTML = group ? `<div class="group-badge" style="background:${color}">${group}</div>` : '';
                td1.innerHTML += `<div class="rich-box title-input" style="background:#f9f9f9; border:none;">${db.topics[idx] || '待定'}</div>`;
            }
            rows[1].appendChild(td1);

            // Row 2: 内容与操作
            let td2 = document.createElement('td');
            td2.innerHTML = `
                <div id="con_${idx}" class="rich-box" contenteditable="${role==='admin'}">${db.contents[idx] || ''}</div>
                <div style="font-size:11px; color:#999; margin-top:10px;">🕒 ${db.editTimes[idx] || '未记录'}</div>
                <button class="btn full-btn" onclick="openFullEditor(${idx})">🔍 ${role==='admin'?'全屏/插图':'查看详情'}</button>
                ${role==='admin' ? `<button class="btn del-btn" onclick="removeIdea(${idx})">🗑️ 删除</button>` : ''}`;
            rows[2].appendChild(td2);
        });

        rows.forEach(r => b.appendChild(r));
        renderVotes(map);
    }

    // 分组变色强同步逻辑
    function liveColorSync(triggerIdx) {
        const gName = document.getElementById(`g_${triggerIdx}`).value.trim();
        const gColor = document.getElementById(`c_${triggerIdx}`).value;
        
        if (!gName) return;

        db.topics.forEach((_, i) => {
            const gi = document.getElementById(`g_${i}`);
            const ci = document.getElementById(`c_${i}`);
            if (gi && gi.value.trim() === gName) {
                ci.value = gColor;
                // 即时改变表格顶线
                document.getElementById('tBody').rows[0].cells[i].style.borderTopColor = gColor;
            }
        });
        // 即时同步到投票区
        scrapeDOM(); 
        renderVotes(db.topics.map((_, i) => i).sort((a,b) => (db.groups[a]||"z").localeCompare(db.groups[b]||"z")));
    }

    function renderVotes(map) {
        const area = document.getElementById('voteArea');
        area.innerHTML = '';
        const myVotes = JSON.parse(localStorage.getItem('myVotes') || '{}');

        map.forEach(idx => {
            const color = db.colors[idx] || "#0366d6";
            area.innerHTML += `
                <div class="vote-card" style="border-top: 6px solid ${color}; animation: slideIn 0.4s var(--elastic);">
                    ${db.groups[idx] ? `<div class="group-badge" style="background:${color}">${db.groups[idx]}</div>` : ''}
                    <h3 style="margin:0;">${db.topics[idx] || '无名创意'}</h3>
                    <div class="vote-num" style="color:${color}">${db.votes[idx]}</div>
                    <button class="btn" style="width:100%; padding:12px; background:${myVotes[idx]?'#fff':'#0366d6'}; color:${myVotes[idx]?'#d73a49':'#fff'}; border:${myVotes[idx]?'1px solid #d73a49':'none'}" onclick="castVote(${idx})">
                        ${myVotes[idx] ? '↩ 撤回支持' : '👆 支持想法'}
                    </button>
                </div>`;
        });
    }

    /* --- 5. 图片直传逻辑 (保留高清压缩) --- */
    async function processImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        setUIStatus("⌛ 正在云端建立图片索引...", "ok");
        const reader = new FileReader();
        reader.onload = (re) => {
            const img = new Image();
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const MAX = 1400; // 高清限制
                let w = img.width, h = img.height;
                if (w > MAX) { h *= MAX/w; w = MAX; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                
                const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                const fname = `mapimg_${Date.now()}.jpg`;
                
                try {
                    const r = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/images/${fname}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${G_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: "upload image", content: base64 })
                    });
                    const res = await r.json();
                    document.getElementById('modalEditor').focus();
                    document.execCommand('insertHTML', false, `<img src="${res.content.download_url}" alt="地图图片">`);
                    setUIStatus("✅ 图片已存入 GitHub 仓库", "ok");
                } catch(err) { alert("上传失败，检查Token权限"); }
            };
            img.src = re.target.result;
        };
        reader.readAsDataURL(file);
    }

    /* --- 6. 辅助工具 --- */
    function scrapeDOM() {
        const now = new Date();
        const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
        db.topics.forEach((_, i) => {
            const t = document.getElementById(`t_${i}`);
            const c = document.getElementById(`con_${i}`);
            const g = document.getElementById(`g_${i}`);
            const cl = document.getElementById(`c_${i}`);
            if (t && (t.value !== db.topics[i] || c.innerHTML !== db.contents[i])) {
                db.editTimes[i] = timeStr;
            }
            if (t) db.topics[i] = t.value;
            if (c) db.contents[i] = c.innerHTML;
            if (g) db.groups[i] = g.value.trim();
            if (cl) db.colors[i] = cl.value;
        });
    }

    function castVote(i) {
        let myVotes = JSON.parse(localStorage.getItem('myVotes') || '{}');
        if (myVotes[i]) { db.votes[i]--; delete myVotes[i]; }
        else { db.votes[i]++; myVotes[i] = true; }
        localStorage.setItem('myVotes', JSON.stringify(myVotes));
        renderAll(); pushToCloud(); // 投票触发即时同步
    }

    function addNewIdea() {
        scrapeDOM();
        db.topics.push(""); db.contents.push(""); db.votes.push(0); 
        db.groups.push(""); db.colors.push("#0366d6"); db.editTimes.push("");
        renderAll();
    }

    function removeIdea(i) {
        if (!confirm('确定彻底移除此创意吗？')) return;
        scrapeDOM();
        db.topics.splice(i, 1); db.contents.splice(i, 1);
        db.votes.splice(i, 1); db.groups.splice(i, 1);
        db.colors.splice(i, 1); db.editTimes.splice(i, 1);
        renderAll();
    }

    function openFullEditor(idx) {
        curIdx = idx;
        const isAdmin = (role === 'admin');
        document.getElementById('editTitle').innerText = isAdmin ? '创意编辑器' : '创意详细内容';
        document.getElementById('adminEditorTools').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('modalConfirm').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('modalEditor').contentEditable = isAdmin;
        document.getElementById('modalEditor').innerHTML = db.contents[idx];
        openModal('editorModal');
    }

    function syncModalBack() {
        document.getElementById(`con_${curIdx}`).innerHTML = document.getElementById('modalEditor').innerHTML;
        closeModal('editorModal');
    }

    function openModal(id) { 
        const m = document.getElementById(id); m.style.display = 'flex'; 
        setTimeout(()=> m.style.opacity = 1, 10);
    }
    function closeModal(id) { 
        const m = document.getElementById(id); m.style.opacity = 0; 
        setTimeout(()=> m.style.display = 'none', 300);
    }
    function setUIStatus(msg, cls) { const s = document.getElementById('status'); s.innerText = msg; s.className = `status-msg ${cls}`; }
    function formatDoc(cmd) { document.execCommand(cmd, false, null); }
    function updateOnline() {
        const count = Math.floor(Math.random() * 5) + 2;
        document.getElementById('onlineTag').innerText = `在线: ${count}`;
    }
</script>
</body>
</html>
